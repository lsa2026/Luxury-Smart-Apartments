# Safe Render preview for ongoing development.
#
# This is intentionally separate from render.yaml, which remains the future
# production blueprint.  It never receives production payment, channel-manager,
# email, webhook, or custom-domain settings.

databases:
  - name: lsa-applepay-uat-postgres
    databaseName: lsa_applepay_uat
    user: lsa_applepay_uat
    # A separate paid database is required because Render permits only one
    # active Free Postgres database per workspace.
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: lsa-applepay-uat-web
    runtime: python
    # Keep this isolated from the existing Free staging service-hour quota.
    plan: starter
    region: frankfurt
    branch: fix/apple-pay-uat-readiness
    autoDeploy: true
    healthCheckPath: /health/live/
    buildCommand: ./build.sh
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 2
      --timeout 60
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      # A staging-only wildcard. Production continues to list only its two
      # approved domains in render.yaml.
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lsa-applepay-uat-postgres
          property: connectionString

      # Keep every external side effect off in the preview.
      - key: HYPERPAY_ENABLED
        value: "False"
      - key: PAYMENT_SANDBOX_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_BOOKING_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_MODIFICATION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_EXTENSION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_CANCELLATION_ENABLED
        value: "False"
      - key: BOOKING_AUTOMATIC_MODIFICATION_APPROVAL
        value: "False"
      - key: BOOKING_AUTOMATIC_CANCELLATION_ENABLED
        value: "False"
      - key: HOSTAWAY_AUTO_SYNC_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_RECEIVER_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_PROCESSING_ENABLED
        value: "False"
      - key: CELERY_SYNC_DISPATCH_ENABLED
        value: "False"
      - key: EMAIL_DELIVERY_ENABLED
        value: "False"
      - key: EMAIL_TASK_SCHEDULE_ENABLED
        value: "False"
      - key: BOOKING_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: CONTACT_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: MODIFICATION_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: GOOGLE_INTEGRATIONS_ENABLED
        value: "False"
      - key: GOOGLE_SIGN_IN_ENABLED
        value: "False"
      - key: APPLE_SIGN_IN_ENABLED
        value: "False"
      - key: OPERATIONS_OWNER_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: OPERATIONS_OWNER_ENFORCEMENT_ENABLED
        value: "True"

  # Neutral, isolated checkout UAT service. The legacy service above stays
  # intact; this service reuses the existing UAT database and keeps payment
  # integrations disabled until the dedicated UAT environment is configured.
  - type: web
    name: checkout-uat-v2
    runtime: python
    plan: starter
    region: frankfurt
    branch: fix/apple-pay-uat-phase2
    autoDeploy: true
    healthCheckPath: /health/live/
    buildCommand: ./build.sh
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 2
      --timeout 60
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lsa-applepay-uat-postgres
          property: connectionString

      # Keep every external side effect off until a dedicated, reviewed setup.
      - key: HYPERPAY_ENABLED
        value: "False"
      - key: PAYMENT_SANDBOX_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_BOOKING_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_MODIFICATION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_EXTENSION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_CANCELLATION_ENABLED
        value: "False"
      - key: BOOKING_AUTOMATIC_MODIFICATION_APPROVAL
        value: "False"
      - key: BOOKING_AUTOMATIC_CANCELLATION_ENABLED
        value: "False"
      - key: HOSTAWAY_AUTO_SYNC_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_RECEIVER_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_PROCESSING_ENABLED
        value: "False"
      - key: CELERY_SYNC_DISPATCH_ENABLED
        value: "False"
      - key: EMAIL_DELIVERY_ENABLED
        value: "False"
      - key: EMAIL_TASK_SCHEDULE_ENABLED
        value: "False"
      - key: BOOKING_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: CONTACT_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: MODIFICATION_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: GOOGLE_INTEGRATIONS_ENABLED
        value: "False"
      - key: GOOGLE_SIGN_IN_ENABLED
        value: "False"
      - key: APPLE_SIGN_IN_ENABLED
        value: "False"
      - key: OPERATIONS_OWNER_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: OPERATIONS_OWNER_ENFORCEMENT_ENABLED
        value: "True"
