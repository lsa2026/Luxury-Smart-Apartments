# Safe Render preview for ongoing development.
#
# This is intentionally separate from render.yaml, which remains the future
# production blueprint. It never receives production payment, channel-manager,
# email, webhook, or custom-domain settings.

databases:
  - name: lsa-staging-postgres
    databaseName: lsa_staging
    user: lsa_staging
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: keyvalue
    name: lsa-staging-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: lsa-staging-web
    runtime: python
    plan: free
    region: frankfurt
    branch: infra/render-staging
    autoDeploy: true
    healthCheckPath: /health/live/
    buildCommand: ./build.sh
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 2
      --timeout 60
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: STAGING_DEMO_DATA_ENABLED
        value: "True"
      # A staging-only wildcard. Production continues to list only its two
      # approved domains in render.yaml.
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lsa-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lsa-staging-cache
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: lsa-staging-cache
          property: connectionString

      # Keep every external side effect off in the preview.
      - key: HYPERPAY_ENABLED
        value: "False"
      - key: PAYMENT_SANDBOX_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_BOOKING_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_MODIFICATION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_EXTENSION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_CANCELLATION_ENABLED
        value: "False"
      - key: BOOKING_AUTOMATIC_MODIFICATION_APPROVAL
        value: "False"
      - key: BOOKING_AUTOMATIC_CANCELLATION_ENABLED
        value: "False"
      - key: HOSTAWAY_AUTO_SYNC_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_RECEIVER_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_PROCESSING_ENABLED
        value: "False"
      - key: CELERY_SYNC_DISPATCH_ENABLED
        value: "True"
      - key: EMAIL_DELIVERY_ENABLED
        value: "False"
      # Stage 7.3: email stays disabled until a one-address queue test is
      # explicitly approved.  Even then, this brake permits only the owner.
      - key: EMAIL_TEST_RECIPIENT_ALLOWLIST
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: Luxury Smart Apartments <saeed@luxurysmartapartments.com>
      - key: EMAIL_REPLY_TO
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TASK_SCHEDULE_ENABLED
        value: "True"
      - key: BOOKING_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: CONTACT_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: MODIFICATION_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: GOOGLE_INTEGRATIONS_ENABLED
        value: "False"
      - key: GOOGLE_SIGN_IN_ENABLED
        value: "False"
      - key: APPLE_SIGN_IN_ENABLED
        value: "False"
      - key: OPERATIONS_OWNER_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: OPERATIONS_OWNER_ENFORCEMENT_ENABLED
        value: "True"

  # One temporary staging process combines the queue worker and scheduler.
  # Production will keep them separate, but this is sufficient to prove the
  # broker, task execution, and scheduled recovery path without doubling cost.
  - type: worker
    name: lsa-staging-queue
    runtime: python
    plan: starter
    region: frankfurt
    branch: infra/render-staging
    autoDeploy: true
    buildCommand: ./build-worker.sh
    startCommand: >-
      celery -A config worker --beat
      --loglevel info
      --concurrency 1
      --without-gossip
      --without-mingle
      --schedule /tmp/celerybeat-schedule
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: STAGING_DEMO_DATA_ENABLED
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # The worker must share signing material with the web process so a
      # queued account link is valid when the guest opens it later.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: lsa-staging-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: lsa-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lsa-staging-cache
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: lsa-staging-cache
          property: connectionString

      # The queue infrastructure is live; every customer-facing or financial
      # side effect remains deliberately off in staging.
      - key: HYPERPAY_ENABLED
        value: "False"
      - key: PAYMENT_SANDBOX_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_BOOKING_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_MODIFICATION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_EXTENSION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_CANCELLATION_ENABLED
        value: "False"
      - key: BOOKING_AUTOMATIC_MODIFICATION_APPROVAL
        value: "False"
      - key: BOOKING_AUTOMATIC_CANCELLATION_ENABLED
        value: "False"
      - key: HOSTAWAY_AUTO_SYNC_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_RECEIVER_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_PROCESSING_ENABLED
        value: "False"
      - key: CELERY_SYNC_DISPATCH_ENABLED
        value: "True"
      - key: EMAIL_DELIVERY_ENABLED
        value: "False"
      - key: EMAIL_TEST_RECIPIENT_ALLOWLIST
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: Luxury Smart Apartments <saeed@luxurysmartapartments.com>
      - key: EMAIL_REPLY_TO
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: lsa-staging-web
          envVarKey: EMAIL_HOST_PASSWORD
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TASK_SCHEDULE_ENABLED
        value: "True"
      - key: BOOKING_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: CONTACT_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: MODIFICATION_NOTIFICATION_EMAIL_ENABLED
        value: "False"
      - key: GOOGLE_INTEGRATIONS_ENABLED
        value: "False"
      - key: GOOGLE_SIGN_IN_ENABLED
        value: "False"
      - key: APPLE_SIGN_IN_ENABLED
        value: "False"
      - key: OPERATIONS_OWNER_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: OPERATIONS_OWNER_ENFORCEMENT_ENABLED
        value: "True"
