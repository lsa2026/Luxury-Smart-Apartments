name: UAT Apple Pay fast-checkout checks
on:
  pull_request:
    branches:
      - fix/apple-pay-uat-phase2
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-quality-gate-9Sx7kL4qP2vN8rT5wY1uC6mH3zB0aF9dK7sJ4xQ8
      DJANGO_ALLOWED_HOSTS: testserver,localhost,luxurysmartapartments.com
      DATABASE_URL: "sqlite:///:memory:"
      HOSTAWAY_AUTO_SYNC_ENABLED: "false"
      HOSTAWAY_LIVE_BOOKING_ENABLED: "false"
      HYPERPAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ".[dev]"
      - continue-on-error: true
        run: ruff check apps/core/middleware.py apps/payments/urls.py apps/payments/views.py apps/reservations/views.py config/settings/base.py tests/test_apple_pay_fast_checkout.py
      - if: always()
        continue-on-error: true
        run: ruff format --check apps/core/middleware.py apps/payments/urls.py apps/payments/views.py apps/reservations/views.py config/settings/base.py tests/test_apple_pay_fast_checkout.py
      - if: always()
        run: pytest -q tests/test_apple_pay_fast_checkout.py
