name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-booking-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lsa_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: lsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://lsa_test:ci-test-only@127.0.0.1:5432/lsa_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ".[dev]"
      - name: Test booking writes on the production database engine
        run: >-
          pytest tests/test_owner_modification_workflow.py
          tests/test_sama_booking_api.py
          tests/test_manual_booking_operations_phase61.py
          tests/test_booking_modifications_phase6.py
          tests/test_ultramsg_accounting_notifications.py
          tests/test_hyperpay_refunds_phase94.py
          tests/test_hyperpay.py
          tests/test_reservation_payment_links.py
          tests/test_morning_stays.py
          tests/test_morning07_communications.py
          tests/test_morning07_gateway.py
          tests/test_offline_payment_receipts.py
          tests/test_automatic_cancellation_refunds.py
          tests/test_property_price_calendar.py
          tests/test_indicative_rates.py
          tests/test_sync_policy_october.py
          tests/test_guest_invoices.py
          tests/test_sama_invoices.py
          tests/test_booking_invoice_navigation.py
          tests/test_completed_stay_cancellation.py
          tests/test_operations_users.py
          tests/test_operations_booking_summary.py
          tests/test_booking_detail_layout.py
          tests/test_loyalty_stage8.py
          tests/test_loyalty_signed_balances.py
          tests/test_loyalty_member_events.py
          tests/test_loyalty_final_readiness.py
          tests/test_loyalty_invitation_links.py
          tests/test_loyalty_booking_invitations.py
          tests/test_guest_phone_auth.py
          tests/test_guest_identity_management.py
          tests/test_guest_booking_history.py
          tests/test_guest_access_address.py
          tests/test_checkout_address_places.py
          tests/test_loyalty_checkout_integration.py
          tests/test_loyalty_checkout_account.py
          tests/test_loyalty_settlement_integration.py
          tests/test_loyalty_booking_operations.py
          tests/test_loyalty_admin_referrals.py
          tests/test_loyalty_visual_tree.py
          tests/test_loyalty_phone_gifts.py
          tests/test_loyalty_public_launch.py
          tests/test_loyalty_public_terms.py
          tests/test_loyalty_program_terms.py
          tests/test_loyalty_scheduled_accrual.py
          tests/test_loyalty_unified_stay_fx.py
          tests/test_loyalty_statement_details.py
          tests/test_loyalty_whatsapp_notices.py
          tests/test_loyalty_message_review.py
          tests/test_loyalty_unified_welcome.py
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_ALLOWED_HOSTS: testserver,localhost,luxurysmartapartments.com
      DATABASE_URL: "sqlite:///:memory:"
      HOSTAWAY_AUTO_SYNC_ENABLED: "false"
      HOSTAWAY_LIVE_BOOKING_ENABLED: "false"
      HOSTAWAY_LIVE_MODIFICATION_ENABLED: "false"
      HOSTAWAY_LIVE_EXTENSION_ENABLED: "false"
      HOSTAWAY_LIVE_CANCELLATION_ENABLED: "false"
      HOSTAWAY_WEBHOOK_RECEIVER_ENABLED: "false"
      HOSTAWAY_WEBHOOK_PROCESSING_ENABLED: "false"
      HYPERPAY_ENABLED: "false"
      EMAIL_DELIVERY_ENABLED: "false"
      EMAIL_TASK_SCHEDULE_ENABLED: "false"
      BOOKING_AUTOMATIC_MODIFICATION_APPROVAL: "false"
      BOOKING_AUTOMATIC_CANCELLATION_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Generate an ephemeral test-only Django secret
        run: python -c 'import os,secrets; open(os.environ["GITHUB_ENV"], "a").write("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64) + "\n")'

      - name: Run tests
        run: pytest

      - name: Test the lazy price calendar interactions
        run: node --test tests/price-calendar.test.cjs

      - name: Test progressive admin booking tabs and form safety
        run: node --test tests/admin-booking-detail.test.cjs tests/admin-morning-availability.test.cjs

      - name: Test independent morning communication and delivery evidence
        run: node --test scripts/automation07/test.cjs

      - name: Test lazy airport driving estimates
        run: node --test tests/airport-directions.test.cjs

      - name: Test opt-in nearby discovery
        run: node --test tests/property-nearby.test.cjs

      - name: Test optional checkout address autocomplete
        run: node --test tests/checkout-address.test.cjs tests/guest-draft-country.test.cjs

      - name: Test checkout phone country and normalization
        run: node --test tests/checkout-phone.test.cjs tests/phone-delivery.test.cjs tests/contact-phone.test.cjs

      - name: Test explicit guest history recovery status and form safety
        run: node --test tests/booking-history.test.cjs

      - name: Test guest invitation clipboard interactions
        run: node --test tests/loyalty-invite.test.cjs

      - name: Test private member tree expansion and safe branch loading
        run: node --test tests/loyalty-tree.test.cjs tests/loyalty-person-tree.test.cjs

      - name: Test native submit commands and duplicate protection
        run: node --test tests/submit-once.test.cjs

      - name: Test guest form validation in Arabic, English and French
        run: node --test tests/form-validation.test.cjs tests/property-map.test.cjs

      - name: Test asynchronous Apple Pay desktop and mobile availability
        run: node --test tests/apple-pay-checkout.test.cjs

      - name: Test consented payment journey and gateway callback isolation
        run: node --test tests/payment-journey.test.cjs tests/analytics-ecommerce.test.cjs tests/measurement-privacy.test.cjs

      - name: Test explicitly consented public Clarity boundaries
        run: node --test tests/clarity-public.test.cjs

      - name: Test consented GA4 UPD and purchase isolation
        run: node --test tests/consent-upd.test.cjs tests/user-provided-data.test.cjs tests/analytics-purchase.test.cjs tests/meta-measurement.test.cjs

      - name: Run Ruff lint
        run: ruff check .

      - name: Verify Ruff formatting
        run: ruff format --check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django deployment checks
        run: python manage.py check --deploy --settings=config.settings.production

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check
