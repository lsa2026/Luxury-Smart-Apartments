{% load i18n %}
<nav class="breadcrumb" aria-label="{% trans 'Breadcrumb' %}">
    <ol>
        <li><a href="{% url 'core:home' %}">{% trans "Home" %}</a></li>
        {% for item in breadcrumb_items %}
        <li>{% if item.url %}<a href="{{ item.url }}">{{ item.label }}</a>{% else %}<span aria-current="page">{{ item.label }}</span>{% endif %}</li>
        {% endfor %}
    </ol>
</nav>
