{% load i18n %}
<form
    class="currency-selector{% if mobile_currency_selector %} currency-selector--mobile{% endif %}"
    method="post"
    action="{% url 'payments:set_currency' %}"
    data-currency-selector
>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ currency_return_url }}">
    <details class="currency-selector__menu" data-currency-menu>
        <summary
            class="currency-selector__trigger"
            role="button"
            aria-label="{% trans 'Display currency' %}: {{ display_currency }}"
            aria-haspopup="menu"
            aria-expanded="false"
            data-currency-trigger
        >
            <span class="currency-selector__current" dir="ltr" aria-hidden="true">
                <strong>{{ display_currency }}</strong>
                {% for option in display_currency_options %}
                    {% if option.code == display_currency %}<span>{{ option.symbol }}</span>{% endif %}
                {% endfor %}
            </span>
            <svg class="currency-selector__chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path d="m4 6 4 4 4-4" />
            </svg>
        </summary>
        <div class="currency-selector__options" role="menu" aria-label="{% trans 'Display currency' %}">
            {% for option in display_currency_options %}
            <button
                class="currency-selector__option{% if option.code == display_currency %} is-selected{% endif %}"
                type="submit"
                name="currency"
                value="{{ option.code }}"
                role="menuitemradio"
                aria-checked="{% if option.code == display_currency %}true{% else %}false{% endif %}"
                data-currency-option
            >
                <span class="currency-selector__identity" dir="ltr">
                    <strong>{{ option.code }}</strong>
                    <span>{{ option.symbol }}</span>
                </span>
                <svg class="currency-selector__check" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="m3 8.5 3 3 7-7" />
                </svg>
            </button>
            {% endfor %}
        </div>
    </details>
</form>
