{% load i18n presentation %}
<nav class="booking-progress" aria-label="{% trans 'Booking request progress' %}">
    <ol>
        <li{% if step == 1 %} aria-current="step"{% endif %} class="{% if step >= 1 %}is-active{% endif %}"><span>{{ 1|localized_number }}</span><small>{% trans "Stay" %}</small></li>
        <li{% if step == 2 %} aria-current="step"{% endif %} class="{% if step >= 2 %}is-active{% endif %}"><span>{{ 2|localized_number }}</span><small>{% trans "Guest details" %}</small></li>
        <li{% if step == 3 %} aria-current="step"{% endif %} class="{% if step >= 3 %}is-active{% endif %}"><span>{{ 3|localized_number }}</span><small>{% trans "Review" %}</small></li>
        <li><span>{{ 4|localized_number }}</span><small>{% trans "Payment" %}</small></li>
        <li><span>{{ 5|localized_number }}</span><small>{% trans "Confirmation" %}</small></li>
    </ol>
</nav>
