{% load i18n static %}
<header class="site-header" data-site-header>
    <div class="container header-inner">
        <a class="brand" href="{% url 'core:home' %}" aria-label="{% trans 'Luxury Smart Apartments home' %}">
            <span class="brand-mark brand-mark--logo" aria-hidden="true">
                <img src="{% static 'images/logo.jpeg' %}" alt="" width="1088" height="988">
            </span>
            <span class="brand-copy">
                <strong>Luxury Smart</strong>
                <small>Apartments</small>
            </span>
        </a>
        <nav class="desktop-nav" aria-label="{% trans 'Primary navigation' %}">
            <a href="{% url 'core:home' %}">{% trans "Home" %}</a>
            <a href="{% url 'properties:list' %}">{% trans "Properties" %}</a>
            <a href="{% url 'core:about' %}">{% trans "About" %}</a>
            <a href="{% url 'core:faq' %}">{% trans "FAQ" %}</a>
            <a href="{% url 'core:contact' %}">{% trans "Contact" %}</a>
            <a href="{% url 'core:home' %}#booking-management">{% trans "Manage booking" %}</a>
        </nav>
        <div class="header-actions">
            {% include "includes/language_switcher.html" %}
            <a class="button button--small" href="{% url 'properties:list' %}#property-search">
                {% trans "Book now" %}
            </a>
            <button
                class="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="mobile-navigation"
                aria-label="{% trans 'Open menu' %}"
                data-menu-toggle
            >
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </button>
        </div>
    </div>
    {% include "includes/mobile_navigation.html" %}
</header>
