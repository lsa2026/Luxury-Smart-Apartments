{% extends "emails/en/base.html" %}
{% block content %}<h1>{{ heading }}</h1><p>{{ message }}</p>{% include "emails/shared/contact_details.html" %}{% if reply_body %}<div dir="auto" style="white-space:pre-wrap;unicode-bidi:plaintext;line-height:1.9;overflow-wrap:anywhere">{{ reply_body }}</div>{% endif %}{% if action_url %}<p><a href="{{ action_url }}" style="display:inline-block;padding:12px 22px;background:#193e36;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:bold">{{ action_label }}</a></p>{% endif %}{% endblock %}
