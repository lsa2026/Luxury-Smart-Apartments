{% load i18n static %}
{% get_current_language as LANGUAGE_CODE %}
<!doctype html>
<html
    lang="{{ LANGUAGE_CODE }}"
    dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}"
>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="شقق ذكية فاخرة للإيجار اليومي والشهري">
    <title>{% block title %}Luxury Smart Apartments{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="{% static 'images/logo.jpeg' %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <script src="{% static 'js/site.js' %}" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'core:home' %}">Luxury Smart Apartments</a>
            <nav aria-label="التنقل الرئيسي">
                <a href="{% url 'core:home' %}">الرئيسية</a>
                <a href="{% url 'properties:list' %}">الوحدات</a>
                <a href="{% url 'reviews:list' %}">آراء ضيوفنا</a>
            </nav>
        </div>
    </header>
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">Luxury Smart Apartments</div>
    </footer>
</body>
</html>
