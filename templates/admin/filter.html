{% load i18n admin_dashboard %}
<details data-filter-title="{{ title }}" open>
  <summary>{% blocktrans with label=title|admin_label %}By {{ label }}{% endblocktrans %}</summary>
  <ul>{% for choice in choices %}<li{% if choice.selected %} class="selected"{% endif %}><a href="{{ choice.query_string|iriencode }}">{{ choice.display }}</a></li>{% endfor %}</ul>
</details>
