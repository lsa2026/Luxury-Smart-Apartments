{% extends "emails/shared/base.html" %}
{% block content %}
<h1 style="margin:0 0 16px;color:#123c35;font-size:27px;line-height:1.5">{{ heading }}</h1>
<p style="margin:0 0 24px;color:#4c5853">{{ message }}</p>
<p style="margin:0 0 20px;text-align:center"><a href="{{ activate_url }}" style="display:inline-block;padding:15px 26px;background:#123c35;color:#fff;border-radius:10px;text-decoration:none">{{ email_copy.confirmation_action }}</a></p>
<p dir="ltr" style="margin:0 0 20px;font-size:12px;word-break:break-all"><a href="{{ activate_url }}" style="color:#193e36">{{ activate_url }}</a></p>
<p style="margin:0;padding-top:16px;border-top:1px solid #e5ddce;color:#65706a;font-size:13px">{{ email_copy.confirmation_notice }}</p>
{% endblock %}
