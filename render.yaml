# Render Blueprint for Luxury Smart Apartments.
#
# Secrets are declared with `sync: false`: Render creates the variable but never
# stores a value from this file, so live gateway and channel-manager credentials
# are entered once in the dashboard and never committed to git.

databases:
  - name: lsa-postgres
    databaseName: luxury_smart_apartments
    user: lsa
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []          # private network only; no public Postgres access

services:
  # Shared cache and Celery broker. Production settings require a shared cache:
  # the Hostaway token provider refuses to run on per-process memory.
  - type: keyvalue
    name: lsa-cache
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: luxury-smart-apartments
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    # The official domain has now been released from the legacy Render account.
    # Both public hostnames are attached here so the production service owns
    # the canonical domain and its www alias.
    domains:
      - luxurysmartapartments.com
      - www.luxurysmartapartments.com
    healthCheckPath: /health/live/
    buildCommand: ./build.sh
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 3
      --threads 2
      --timeout 60
      --graceful-timeout 30
      --max-requests 1000
      --max-requests-jitter 100
      --access-logfile -
      --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Explicit rather than blank: worker and beat never receive
      # RENDER_EXTERNAL_HOSTNAME, and production settings refuse an empty host
      # list. The generated *.onrender.com host is appended at runtime from
      # RENDER_EXTERNAL_HOSTNAME, so only custom domains belong here.
      - key: DJANGO_ALLOWED_HOSTS
        value: luxurysmartapartments.com,www.luxurysmartapartments.com

      # --- Google measurement ------------------------------------------
      # GTM owns all public marketing destinations. Analytics and advertising
      # tags load only after the guest grants the corresponding cookie consent.
      - key: GOOGLE_INTEGRATIONS_ENABLED
        value: "True"
      - key: GOOGLE_TAG_MANAGER_ENABLED
        value: "True"
      - key: GOOGLE_TAG_MANAGER_CONTAINER_ID
        value: GTM-M9VLL75K
      - key: GOOGLE_ANALYTICS_ENABLED
        value: "True"
      - key: GOOGLE_ANALYTICS_MEASUREMENT_ID
        value: G-7E43GT39DN
      - key: GOOGLE_CONSENT_MODE_ENABLED
        value: "True"

      - key: DATABASE_URL
        fromDatabase:
          name: lsa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lsa-cache
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: lsa-cache
          property: connectionString

      # --- UAT safety -----------------------------------------------------
      # Production checkout: credentials remain dashboard-only secrets. A
      # verified payment must create the corresponding Hostaway reservation.
      - key: HYPERPAY_ENABLED
        value: "True"
      - key: HYPERPAY_ENVIRONMENT
        value: production
      - key: HYPERPAY_BASE_URL
        value: https://eu-prod.oppwa.com/
      - key: HYPERPAY_ENTITY_ID
        sync: false
      - key: HYPERPAY_ACCESS_TOKEN
        sync: false
      - key: HYPERPAY_CURRENCY
        value: SAR
      - key: HYPERPAY_PAYMENT_TYPE
        value: DB
      - key: HYPERPAY_PREPAYMENT_REVALIDATION_ENABLED
        value: "True"
      - key: PAYMENT_SANDBOX_ENABLED
        value: "False"

      # --- Hostaway -----------------------------------------------------
      - key: HOSTAWAY_BASE_URL
        value: https://api.hostaway.com/v1
      - key: HOSTAWAY_ACCOUNT_ID
        sync: false
      - key: HOSTAWAY_API_SECRET
        sync: false
      - key: HOSTAWAY_ACCESS_TOKEN
        sync: false
      # Required by check payments.E107 while HyperPay runs in production: a
      # verified payment must create the real reservation, never a local one.
      - key: HOSTAWAY_LIVE_BOOKING_ENABLED
        value: "True"
      # Channel a website booking is filed under. Verified against this account:
      # every reservation the public API creates carries channelId 2000 "direct".
      # Creation is refused outright when this is missing.
      - key: HOSTAWAY_DIRECT_CHANNEL_ID
        value: "2000"
      # Extensions and date/guest changes apply themselves once the guest has
      # paid any difference. payments.E108 refuses to boot unless all three of
      # these agree, so they move together.
      - key: BOOKING_AUTOMATIC_MODIFICATION_APPROVAL
        value: "False"
      - key: HOSTAWAY_LIVE_MODIFICATION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_EXTENSION_ENABLED
        value: "False"
      # Cancellations apply themselves too. What the guest is owed comes from the
      # CancellationPolicyTier table the administration maintains, is written down
      # as a RefundObligation, and is deducted from reported income until someone
      # transfers it. An empty tier table refunds nothing automatically.
      - key: BOOKING_AUTOMATIC_CANCELLATION_ENABLED
        value: "False"
      - key: BOOKING_AUTOMATIC_REFUND_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_CANCELLATION_ENABLED
        value: "False"
      # Working days quoted to the guest for the bank transfer.
      - key: BOOKING_REFUND_WORKING_DAYS
        value: "5"
      # Scheduled synchronisation. These intervals populate CELERY_BEAT_SCHEDULE;
      # the lsa-beat service dispatches them and lsa-worker runs them. Each task
      # takes a Redis lock, so a slow run is skipped rather than overlapped.
      - key: HOSTAWAY_AUTO_SYNC_ENABLED
        value: "True"
      - key: HOSTAWAY_REVIEW_SYNC_ENABLED
        value: "False"
      - key: TRUSTINDEX_REVIEW_SYNC_ENABLED
        value: "False"
      - key: HOSTAWAY_AUTO_SYNC_INTERVAL_MINUTES
        value: "5"
      - key: HOSTAWAY_REVIEW_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: HOSTAWAY_WEBHOOK_PROCESS_INTERVAL_MINUTES
        value: "1"
      - key: HOSTAWAY_BOOKING_RECONCILIATION_INTERVAL_MINUTES
        value: "1"
      - key: BOOKING_EXPIRATION_INTERVAL_MINUTES
        value: "5"
      # Reception and processing of Hostaway's unified webhook. The endpoint
      # refuses every call until the basic-auth secrets below are set, and
      # integrations.E001 stops a deploy that enables it without them.
      - key: HOSTAWAY_WEBHOOK_RECEIVER_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_PROCESSING_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_BASIC_AUTH_USERNAME
        sync: false
      - key: HOSTAWAY_WEBHOOK_BASIC_AUTH_PASSWORD
        sync: false

      # --- Email --------------------------------------------------------
      # Google Workspace carries the transactional messages. The dedicated app
      # password remains a dashboard secret and is shared with the worker below.
      - key: EMAIL_DELIVERY_ENABLED
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: DEFAULT_FROM_EMAIL
        value: Luxury Smart Apartments <notifications@luxurysmartapartments.com>
      - key: EMAIL_REPLY_TO
        value: saeed@luxurysmartapartments.com
      - key: SUPPORT_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: OPERATIONS_EMAIL
        value: saeed@luxurysmartapartments.com

      # --- Owner access and social identity --------------------------------
      # Google verifies identity; the Django application grants administrative
      # authority only to the exact business owner address below. OAuth secrets
      # are dashboard-only values and are never committed to this blueprint.
      - key: OPERATIONS_OWNER_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: OPERATIONS_OWNER_ENFORCEMENT_ENABLED
        value: "True"
      - key: GOOGLE_SIGN_IN_ENABLED
        value: "False"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: APPLE_SIGN_IN_ENABLED
        value: "False"
      - key: APPLE_SERVICE_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: BOOKING_NOTIFICATION_EMAIL_ENABLED
        value: "True"
      - key: CONTACT_NOTIFICATION_EMAIL_ENABLED
        value: "True"
      - key: MODIFICATION_NOTIFICATION_EMAIL_ENABLED
        value: "True"
      - key: EMAIL_TASK_SCHEDULE_ENABLED
        value: "True"

      # --- Site ---------------------------------------------------------
      # Public origin of the service. Not a secret, so it lives in the blueprint
      # and stays correct on every rebuild. Canonical links, sitemaps, and email
      # links all read this, so it must match the primary custom domain.
      - key: SITE_BASE_URL
        value: https://luxurysmartapartments.com
      - key: SITE_CANONICAL_URL
        value: https://luxurysmartapartments.com
      - key: EMAIL_BRAND_NAME
        value: Luxury Smart Apartments
      # Private alert for Aseel after an owner confirms a manual Hostaway
      # reservation.  The credentials remain dashboard-only secrets.
      - key: ACCOUNTING_WHATSAPP_NAME
        value: Aseel Hafez
      - key: ACCOUNTING_WHATSAPP_NUMBER
        value: "+966597193102"
      - key: ULTRAMSG_ENABLED
        value: "True"
      - key: ULTRAMSG_API_BASE_URL
        value: https://api.ultramsg.com
      - key: ULTRAMSG_INSTANCE_ID
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
      # Lets the admin "sync now" actions hand work to the worker instead of
      # blocking a request thread. Requires lsa-worker to be running.
      - key: CELERY_SYNC_DISPATCH_ENABLED
        value: "True"

  # Executes the queued tasks. Kept separate from the scheduler so it can be
  # scaled up later without ever running two schedulers.
  - type: worker
    name: lsa-worker
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: ./build-worker.sh
    startCommand: >-
      celery -A config worker
      --loglevel info
      --concurrency 2
      --max-tasks-per-child 100
      --without-gossip
      --without-mingle
    envVars: &celery_env
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: luxurysmartapartments.com,www.luxurysmartapartments.com
      # Copied from the web service so all three processes share one signing key
      # and one set of provider credentials, with no second place to update.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: luxury-smart-apartments
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: lsa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lsa-cache
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: lsa-cache
          property: connectionString

      - key: HOSTAWAY_BASE_URL
        value: https://api.hostaway.com/v1
      # The worker receives the same dashboard-only credentials as the web
      # service.  They are never committed to this file and stay inactive
      # until the explicit UAT/live switches are enabled below.
      - key: HOSTAWAY_ACCOUNT_ID
        fromService:
          type: web
          name: luxury-smart-apartments
          envVarKey: HOSTAWAY_ACCOUNT_ID
      - key: HOSTAWAY_API_SECRET
        fromService:
          type: web
          name: luxury-smart-apartments
          envVarKey: HOSTAWAY_API_SECRET
      - key: HOSTAWAY_ACCESS_TOKEN
        fromService:
          type: web
          name: luxury-smart-apartments
          envVarKey: HOSTAWAY_ACCESS_TOKEN
      - key: HOSTAWAY_AUTO_SYNC_ENABLED
        value: "True"
      - key: HOSTAWAY_REVIEW_SYNC_ENABLED
        value: "False"
      - key: TRUSTINDEX_REVIEW_SYNC_ENABLED
        value: "False"
      - key: HOSTAWAY_AUTO_SYNC_INTERVAL_MINUTES
        value: "5"
      - key: HOSTAWAY_REVIEW_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: HOSTAWAY_WEBHOOK_PROCESS_INTERVAL_MINUTES
        value: "1"
      - key: HOSTAWAY_BOOKING_RECONCILIATION_INTERVAL_MINUTES
        value: "1"
      - key: BOOKING_EXPIRATION_INTERVAL_MINUTES
        value: "5"
      # Must match the web service: the payments checks run in every process,
      # so a mismatch would stop the worker from booting at all.
      - key: HOSTAWAY_LIVE_BOOKING_ENABLED
        value: "True"
      # Channel a website booking is filed under. Verified against this account:
      # every reservation the public API creates carries channelId 2000 "direct".
      # Creation is refused outright when this is missing.
      - key: HOSTAWAY_DIRECT_CHANNEL_ID
        value: "2000"
      - key: BOOKING_AUTOMATIC_MODIFICATION_APPROVAL
        value: "False"
      - key: HOSTAWAY_LIVE_MODIFICATION_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_EXTENSION_ENABLED
        value: "False"
      - key: BOOKING_AUTOMATIC_CANCELLATION_ENABLED
        value: "False"
      - key: BOOKING_AUTOMATIC_REFUND_ENABLED
        value: "False"
      - key: HOSTAWAY_LIVE_CANCELLATION_ENABLED
        value: "False"
      # Working days quoted to the guest for the bank transfer.
      - key: BOOKING_REFUND_WORKING_DAYS
        value: "5"
      # These processes serve no HTTP, so they never receive the webhook: only
      # the web service does. Keeping reception off here is what it is, and it
      # keeps the basic-auth secret in the one service that actually checks it.
      # They still drain the queue the web service fills.
      - key: HOSTAWAY_WEBHOOK_RECEIVER_ENABLED
        value: "False"
      - key: HOSTAWAY_WEBHOOK_PROCESSING_ENABLED
        value: "False"

      - key: HYPERPAY_ENABLED
        value: "False"
      - key: HYPERPAY_ENVIRONMENT
        value: production
      - key: HYPERPAY_BASE_URL
        value: https://eu-prod.oppwa.com/
      - key: HYPERPAY_ENTITY_ID
        # No payment credentials are present until the explicit launch
        # checkpoint.  HyperPay itself is disabled above.
        value: ""
      - key: HYPERPAY_ACCESS_TOKEN
        value: ""
      - key: HYPERPAY_CURRENCY
        value: SAR
      - key: HYPERPAY_PAYMENT_TYPE
        value: DB
      - key: HYPERPAY_PREPAYMENT_REVALIDATION_ENABLED
        value: "True"
      - key: PAYMENT_SANDBOX_ENABLED
        value: "False"

      - key: EMAIL_DELIVERY_ENABLED
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: saeed@luxurysmartapartments.com
      - key: EMAIL_HOST_PASSWORD
        # Set once in the Render dashboard for this worker. Do not commit it.
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: DEFAULT_FROM_EMAIL
        value: Luxury Smart Apartments <notifications@luxurysmartapartments.com>
      - key: EMAIL_REPLY_TO
        value: saeed@luxurysmartapartments.com
      - key: SUPPORT_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: OPERATIONS_EMAIL
        value: saeed@luxurysmartapartments.com
      - key: BOOKING_NOTIFICATION_EMAIL_ENABLED
        value: "True"
      - key: CONTACT_NOTIFICATION_EMAIL_ENABLED
        value: "True"
      - key: MODIFICATION_NOTIFICATION_EMAIL_ENABLED
        value: "True"
      - key: EMAIL_TASK_SCHEDULE_ENABLED
        value: "True"
      - key: EMAIL_BRAND_NAME
        value: Luxury Smart Apartments
      - key: SITE_BASE_URL
        value: https://luxurysmartapartments.com
      - key: SITE_CANONICAL_URL
        value: https://luxurysmartapartments.com
      - key: CELERY_SYNC_DISPATCH_ENABLED
        value: "True"

  # The single scheduler. Exactly one instance must ever run: a second beat
  # would dispatch every scheduled task twice.
  - type: worker
    name: lsa-beat
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: ./build-worker.sh
    startCommand: >-
      celery -A config beat
      --loglevel info
      --schedule /tmp/celerybeat-schedule
    envVars: *celery_env
